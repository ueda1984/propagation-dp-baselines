name: Validate reference code

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify checksums of archived source files
        run: sha256sum -c SHA256SUMS.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run smoke and edge cases
        run: |
          python run_validation.py --mode smoke
          python run_validation.py --mode edge
      - name: Run all synthetic correctness checks
        run: python run_validation.py --mode full
