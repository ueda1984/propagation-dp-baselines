name: Validate reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tested dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Check source and release manifest
        run: sha256sum -c SHA256SUMS.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Smoke tests
        run: python run_validation.py --mode smoke
      - name: Edge-case tests
        run: python run_validation.py --mode edge
      - name: Full synthetic correctness validation
        run: python run_validation.py --mode full
